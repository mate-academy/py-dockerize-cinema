services:
  cinema:
    build:
      context: .
    command: >
      sh -c "python manage.py wait_for_db &&
      python manage.py migrate && 
      python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./:/app
      - local_media:/files/media

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - local_db:${PGDATA}
    ports:
      - "5433:5432"

volumes:
  local_db:
  local_media:
