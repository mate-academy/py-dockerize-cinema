services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
      POSTGRES_USER: ${POSTGRES_USER:-cinema_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinema-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "gunicorn cinema_service.wsgi:application
             --bind 0.0.0.0:8000
             --workers 3"
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - cinema-net
    restart: always

volumes:
  postgres_data:
  media_volume:
  static_volume:

networks:
  cinema-net:
