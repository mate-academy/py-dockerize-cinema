services:
  cinema:
    image: genazubarev/docker-cinema
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - app_media:/files/media
    command: >
      sh -c "python manage.py wait_for_db && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      cinema_app_db:
        condition: service_healthy

  cinema_app_db:
    image: postgres:16-alpine3.17
    restart: always
    env_file:
      - .env
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - app_db:$PGDATA
volumes:
  app_media:
  app_db:
