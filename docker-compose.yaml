volumes:
  postgres_data:
  media_data:

services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    command: >
      sh -c "
      python manage.py wait_for_db &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    build:
      context: .
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
    restart: always
    ports:
      - "8000:8000"
