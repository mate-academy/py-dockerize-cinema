services:
  cinema:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - cinema_media:/upload/media
      - cinema_static:/upload/static
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db


  db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - cinema_db:$PGDATA

volumes:
  cinema_db:
  cinema_media:
  cinema_static:
