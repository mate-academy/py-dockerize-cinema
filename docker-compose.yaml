services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: >
      sh -c "python manage.py wait_for_db && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
    volumes:
      - cinema_media:/app/media


  db:
    image: postgres:16.0-alpine
    restart: unless-stopped
    expose:
      - "5432"
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data


volumes:
  db_data:
  cinema_media:
