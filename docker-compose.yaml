version: "3"
services:
  cinema:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - media:/files/media
    command: >
      python manage.py wait_for_db &&
      sh -c "python manage.py makemigrations &&
      python manage.py wait_for_db
      && python manage.py collectstatic --noinput
      && python manage.py migrate &&
                python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  db:
    image: postgres:alpine3.19
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - my_db:$PGDATA

volumes:
  my_db:
  media: