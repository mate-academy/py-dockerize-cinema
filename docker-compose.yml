services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - media:/app/media
      - static:/app/static
    depends_on:
      - db

volumes:
  postgres_data:
  media:
  static: