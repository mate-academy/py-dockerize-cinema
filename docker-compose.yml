services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - my_media:/files/media
      - my_static:/files/static
    depends_on:
      - db

  db:
    image: postgres:16-alpine3.17
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:$PGDATA


volumes:
  my_db:
  my_media:
  my_static:
