services:
  app:
    build:
      context: .
    command: >
      sh -c "python manage.py wait_for_db
      && python manage.py migrate
      && python manage.py collectstatic --noinput
      && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/vol/web/media
      - static_data:/vol/web/static
    environment:
      DB_HOST: db
      DB_NAME: cinema
      DB_USER: cinema
      DB_PASSWORD: cinema
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  media_data:
  static_data:
