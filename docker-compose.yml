services:
    app:
        build:
            context: .
        env_file:
            - .env
        ports:
            - "8000:8000"
        command: >
            sh -c "sleep 10 &&
                   python manage.py migrate &&
                   python manage.py runserver 0.0.0.0:8000"
        depends_on:
            - db
        volumes:
            - app_media:/app/media

    db:
        image: postgres:16
        restart: always
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

volumes:
    db_data:
    app_media: