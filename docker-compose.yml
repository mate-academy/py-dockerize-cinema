version: "3.3"

services:
  db:
    image: postgres:14-alpine
    container_name: cinema_db
    environment:
      - POSTGRES_DB=cinema_db_name
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: cinema_app
    command: sh -c "python manage.py wait_for_db && python manage.py migrate && python manage.py runserver 0.0.0.0:8000 --noreload"
    ports:
      - "8000:8000"
    volumes:
      - cinema_media:/app/media
    environment:
      - DB_HOST=db
      - DB_NAME=cinema_db_name
      - DB_USER=postgres_user
      - DB_PASSWORD=postgres_password
    depends_on:
      - db

volumes:
  postgres_data:
  cinema_media: