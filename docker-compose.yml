version: "3"
services:
  app:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    command: sh -c "python manage.py wait_for_db &&
      python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db


  db:
    image: postgres:16-alpine
    restart: always
    env_file:
    - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media: