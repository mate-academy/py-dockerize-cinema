version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: cinema_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=cinema
      - POSTGRES_USER=cinema
      - POSTGRES_PASSWORD=cinema
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: cinema_app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=cinema
      - DB_USER=cinema
      - DB_PASSWORD=cinema
      - DB_PORT=5432

volumes:
  postgres_data:
  media_volume:
