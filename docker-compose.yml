services:
  app:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./:/app/
      - my_media_volume:/files/media
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py wait_for_db &&
         python manage.py migrate &&
         mkdir -p /files/media &&
         chown -R django-user:django-user /files/media &&
         python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  db:
    image: postgres:16.0-alpine3.17
    env_file:
      - .env
    volumes:
      - my_data_volume:$PGDATA
    ports:
      - "5432:5432"
    restart: always

volumes:
  my_data_volume:
  my_media_volume:
