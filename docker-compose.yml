version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_data:/vol/web/static
      - media_data:/vol/web/media
    environment:
      DB_HOST: db
      DB_NAME: cinema
      DB_USER: cinema
      DB_PASSWORD: cinema
      DB_PORT: "5432"
      DJANGO_DEBUG: "1"
    depends_on:
      - db
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  static_data:
  media_data: