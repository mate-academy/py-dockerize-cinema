services:
  app:
    build: .

    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:14-alpine
    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    env_file:
      - .env

volumes:
  postgres_data:
  static_volume:
  media_volume:
