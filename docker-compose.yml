services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - my_media:/files/media
      - my_static:/files/static
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - my_db:/var/lib/postgresql/data

volumes:
  my_db:
  my_media:
  my_static:
