services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  db:
    image: postgres:15-alpine3.17
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - my_db:$PGDATA
    env_file:
      - .env

volumes:
  my_db:
