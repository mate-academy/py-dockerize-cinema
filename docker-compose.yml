services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: db_cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/vol/web/media
    environment:
      - POSTGRES_DB=db_cinema
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    # Executa wait_for_db, roda as migrações e sobe o servidor
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
