services:
  app:
    build:
      context: .
    ports:
      - "8001:8000"
    command: sh -c "python manage.py wait_for_db && python manage.py migrate  && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./media:/app/media
      - ./static:/app/static
  db:
    image: postgres:14-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - db_volume:/var/lib/postgresql/data

volumes:
  db_volume:
