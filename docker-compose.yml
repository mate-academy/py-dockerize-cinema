services:
  cinema:
    build:
      context: .
    environment:
      - POSTGRES_DB=cinema
      - POSTGRES_USER=cinema
      - POSTGRES_PASSWORD=cinema
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - my_media:/files/media
    command:
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  db:
    image: postgres:16.0-alpine3.17
    restart: always
    environment:
      - POSTGRES_DB=cinema
      - POSTGRES_USER=cinema
      - POSTGRES_PASSWORD=cinema
    ports:
      - "5432:5432"
    volumes:
      - my_db:$PGDATA

volumes:
  my_db:
  my_media: