services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/vol/web/media
      - static_data:/vol/web/static
    environment:
      DB_HOST: db
      DB_NAME: cinema
      DB_USER: cinema
      DB_PASSWORD: cinema
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
  static_data:
