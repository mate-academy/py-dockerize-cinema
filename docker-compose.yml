version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media:/app/media
      - static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: cinema
      DB_USER: cinema_user
      DB_PASSWORD: cinema_pass
      DB_HOST: db

volumes:
  postgres_data:
  media:
  static:
