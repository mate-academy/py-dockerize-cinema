name: Test

on:
  push:
    branches:
      - "develop"
  pull_request:
    branches:
      - "master"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure local test environment
        run: |
          cp .env.example .env
          echo 'INSTALL_DEV=true' >> .env

      - name: Build and start services
        run: docker compose up --build -d

      - name: Test against PostgreSQL
        run: |
          docker compose run --rm app python manage.py test
          docker compose run --rm app python manage.py makemigrations --check --dry-run
          docker compose run --rm app flake8
          docker compose run --rm app pip check

      - name: Check API, image uploads, and volume persistence
        env:
          DJANGO_SUPERUSER_EMAIL: smoke@example.com
          DJANGO_SUPERUSER_PASSWORD: ci-only-smoke-password-123
        run: |
          docker compose exec -T -e DJANGO_SUPERUSER_EMAIL -e DJANGO_SUPERUSER_PASSWORD app python manage.py createsuperuser --noinput
          python3 scripts/smoke_test.py create
          docker compose down
          docker compose up -d
          python3 scripts/smoke_test.py verify
          test "$(docker compose exec -T app id -u)" != "0"

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down --volumes
