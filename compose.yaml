services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: sh -c "python manage.py wait_for_db && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app

    volumes:
      - ./:/app
      - media:/media

  db:
    image: "postgres:17-alpine"
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:$PGDATA

volumes:
  my_db:
  media: